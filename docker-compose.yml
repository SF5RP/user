services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: userpassword
      POSTGRES_DB: userdb
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    command:
      - "postgres"
      - "-c"
      - "password_encryption=scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: userpassword
      DB_NAME: userdb
      DATABASE_URL: postgres://user:userpassword@postgres:5432/userdb?sslmode=disable
      DISCORD_CLIENT_ID: 1356281628535685120
      DISCORD_CLIENT_SECRET: yl0ZPA2Lj4CnKrRGQFc5iIRVOp78yFzY
      DISCORD_REDIRECT_URI: http://localhost:8080/api/callback
      JWT_SECRET: k9DXqOcTxcOOo3c9EhubIW5U1LixadYSXzrEUqFGUh3
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Должно совпадать с тем, что отправляет казино в return_to:
      # window.location.origin + "/auth/callback"
      ALLOWED_RETURN_URLS: http://localhost:3000/auth/callback,http://localhost:3001/auth/callback
      SERVER_PORT: 8080
      ENVIRONMENT: development
    ports:
      - "8080:8080"
    networks:
      - auth-network

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://user:userpassword@postgres:5432/userdb?sslmode=disable
      MIGRATIONS_PATH: /root/migrations
    entrypoint: ["/root/migrator"]
    networks:
      - auth-network

volumes:
  db_data:

networks:
  auth-network:
