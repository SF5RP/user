name: Build and Deploy Frontend

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

jobs:
  build-and-deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "20.x"
      FRONTEND_DIR: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Activate Yarn
        run: |
          corepack prepare yarn@4.10.3 --activate

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          corepack yarn install --immutable || (echo "Immutable install failed; retrying without immutable" && YARN_ENABLE_IMMUTABLE_INSTALLS=false corepack yarn install)

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          corepack yarn deploy:prep

      - name: Prepare deploy artifact
        run: |
          tar -czf frontend.tgz -C ${{ env.FRONTEND_DIR }}/dist auth-service-frontend

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "just-a-placeholder"

      - name: Upload artifact and deploy via SSH
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_DIR: /tmp
        run: |
          echo "🚀 Deploying frontend..."

          ssh -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} $REMOTE_USER@$REMOTE_HOST "mkdir -p $REMOTE_DIR"

          scp -o StrictHostKeyChecking=no -P ${SSH_PORT:-22} frontend.tgz $REMOTE_USER@$REMOTE_HOST:$REMOTE_DIR/frontend.tgz
          scp -o StrictHostKeyChecking=no -P ${SSH_PORT:-22} frontend/deploy/deploy_frontend.sh $REMOTE_USER@$REMOTE_HOST:$REMOTE_DIR/deploy_frontend.sh

          ssh -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} $REMOTE_USER@$REMOTE_HOST "bash -s" << 'EOF'
          set -e
          chmod +x /tmp/deploy_frontend.sh
          /tmp/deploy_frontend.sh /tmp/frontend.tgz
          rm -f /tmp/frontend.tgz /tmp/deploy_frontend.sh
          EOF

      - name: Health check
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "🏥 Running health check..."
          FRONTEND_URL=${{ secrets.FRONTEND_URL || format('http://{0}:12413', secrets.SERVER_HOST) }}
          echo "Checking URL: $FRONTEND_URL"
          echo "Server Host: ${{ secrets.SERVER_HOST }}"

          # Wait a moment for the service to fully start
          sleep 5

          # Try HTTP health check first
          echo "🌐 Testing HTTP connectivity..."
          if curl -fsS --connect-timeout 10 --max-time 30 "$FRONTEND_URL/" || curl -fsS --connect-timeout 10 --max-time 30 "$FRONTEND_URL/login"; then
            echo "✅ Frontend HTTP check passed"
          else
            echo "⚠️ HTTP check failed, trying systemd status via SSH..."

            if ssh -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} $REMOTE_USER@$REMOTE_HOST "systemctl is-active --quiet auth-service-frontend"; then
              echo "✅ auth-service-frontend is active (SSH fallback check passed)"
            else
              echo "❌ Both HTTP and SSH checks failed"
              echo "Systemd status:"
              ssh -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} $REMOTE_USER@$REMOTE_HOST "systemctl status auth-service-frontend --no-pager" || true
              exit 1
            fi
          fi

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## 🚀 Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "- **URL**: ${{ secrets.FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 💥 Frontend Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
