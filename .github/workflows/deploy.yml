name: Build and Deploy User Service

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  GO_VERSION: "1.22"
  APP_NAME: auth-service
  REMOTE_BASE_DIR: /srv/auth-service
  REMOTE_TMP_DIR: /tmp/auth-service-deploy/backend
  REMOTE_ARCHIVE: auth-service-backend.tar.gz

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run tests
        working-directory: backend
        run: go test ./... || true

      - name: Prepare backend release
        working-directory: backend
        run: |
          make deploy-prep
          tar -czf ${{ env.REMOTE_ARCHIVE }} -C dist auth-service-backend

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "just-a-placeholder"

      - name: Upload backend deploy script and package
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts || true
          ssh -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} $REMOTE_USER@$REMOTE_HOST "mkdir -p ${{ env.REMOTE_BASE_DIR }}/backend/deploy ${{ env.REMOTE_TMP_DIR }}"
          scp -o StrictHostKeyChecking=no -P ${SSH_PORT:-22} backend/deploy/deploy_backend.sh $REMOTE_USER@$REMOTE_HOST:${{ env.REMOTE_BASE_DIR }}/backend/deploy/deploy_backend.sh
          scp -o StrictHostKeyChecking=no -P ${SSH_PORT:-22} backend/${{ env.REMOTE_ARCHIVE }} $REMOTE_USER@$REMOTE_HOST:${{ env.REMOTE_TMP_DIR }}/${{ env.REMOTE_ARCHIVE }}

      - name: Check backend deploy prerequisites
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} $REMOTE_USER@$REMOTE_HOST "bash -s" << 'EOF'
          set -e
          chmod +x "/srv/auth-service/backend/deploy/deploy_backend.sh"
          if [ ! -f "/srv/auth-service/shared/backend/env/backend.env" ]; then
            echo "Missing backend env file: /srv/auth-service/shared/backend/env/backend.env" >&2
            exit 1
          fi
          unit_found=
          for p in /etc/systemd/system/auth-service-backend.service /lib/systemd/system/auth-service-backend.service /usr/lib/systemd/system/auth-service-backend.service; do
            if [ -f "$p" ]; then unit_found=1; break; fi
          done
          if [ -z "$unit_found" ]; then
            echo "auth-service-backend.service not found. Copy deploy/systemd/auth-service-backend.service.example to /etc/systemd/system/auth-service-backend.service, daemon-reload, enable." >&2
            exit 1
          fi
          EOF

      - name: Run backend deploy
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} $REMOTE_USER@$REMOTE_HOST "bash -s" << 'EOF'
          set -e
          "/srv/auth-service/backend/deploy/deploy_backend.sh" "/tmp/auth-service-deploy/backend/auth-service-backend.tar.gz"
          EOF

      - name: Health check
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "🏥 Running health check..."
          sleep 5
          if ssh -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} $REMOTE_USER@$REMOTE_HOST "curl -fsS http://127.0.0.1:8080/health"; then
            echo "✅ Backend health check passed!"
          else
            echo "⚠️ Direct backend health check failed, checking systemd status..."
            if ssh -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} $REMOTE_USER@$REMOTE_HOST "systemctl is-active --quiet auth-service-backend"; then
              echo "✅ auth-service-backend is active (SSH fallback check passed)"
            else
              echo "❌ Backend health check failed"
              ssh -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} $REMOTE_USER@$REMOTE_HOST "systemctl status auth-service-backend --no-pager" || true
              exit 1
            fi
          fi

      - name: External health check
        run: |
          if curl -fsS http://${{ secrets.SERVER_HOST }}/health; then
            echo "✅ External health check passed!"
          else
            echo "⚠️ External health check failed. This usually means nginx/server_name/DNS is not pointing this host to the auth backend yet."
          fi

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Environment**: production" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 💥 Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Environment**: production" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
